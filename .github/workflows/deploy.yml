name: Deploy

on:
  push:
    branches:
      - main        # → production (the only branch that deploys here; staging has deploy-staging.yml)

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    # Guard: even if the trigger above is edited, only main may touch the production host.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            export DEPLOY_ENV=production
            echo "==> Deploying env=$DEPLOY_ENV"

            cd ~/aftermarketmonkey-be

            echo "==> git pull"
            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "==> docker compose build"
            DEPLOY_ENV=$DEPLOY_ENV docker compose build

            echo "==> docker compose up -d"
            DEPLOY_ENV=$DEPLOY_ENV docker compose up -d

            echo "==> Running DB migrations"
            DEPLOY_ENV=$DEPLOY_ENV docker compose exec -T app python manage.py migrate --no-input

            echo "==> Done"
