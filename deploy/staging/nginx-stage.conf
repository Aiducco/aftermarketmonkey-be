# Host nginx site for stage.aftermarketscout.com (staging VM only). Install:
#   sudo cp deploy/staging/nginx-stage.conf /etc/nginx/sites-available/stage.aftermarketscout.com
#   sudo ln -sf /etc/nginx/sites-available/stage.aftermarketscout.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stage.aftermarketscout.com --redirect -m <your email> --agree-tos -n
# certbot adds the 443 listener and the http->https redirect to this file in place.
#
# One host for everything (no CORS): / -> fe container, /api/ -> be container, /meilisearch/ -> Meilisearch.
# Open on purpose (decision 2026-11-23) but never indexed: X-Robots-Tag on every response and a deny-all robots.txt.
# Do not add add_header inside a location: that would drop the server-level X-Robots-Tag for that location.

server {
    listen 80;
    listen [::]:80;
    server_name stage.aftermarketscout.com;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 25m;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /meilisearch/ {
        proxy_pass http://127.0.0.1:7700/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
