# Staging stack for stage.aftermarketscout.com (its own VM; never the production host).
# Always run with the staging env file, which also feeds the ${...} values below:
#   docker compose -f docker-compose.staging.yml --env-file .env.app.staging up -d
# Everything binds to 127.0.0.1; the host nginx (deploy/staging/nginx-stage.conf) is the only public entry point.
name: aftermarketscout-staging-be

services:
  app:
    build:
      context: .
    image: aftermarketmonkey_be:staging   # never the production :latest tag
    restart: always
    env_file:
      - ./.env.app.staging
    environment:
      DJANGO_SETTINGS_MODULE: conf.settings_staging
      DATABASE_HOST: postgres
      CACHE_HOST: redis
      CACHE_PORT: "6379"
      MEILISEARCH_HOST: http://meilisearch:7700
    ports:
      - "127.0.0.1:8005:8000"
    volumes:
      - /srv/staging/catalog-subset:/data/catalog-subset   # export_catalog_subset output, read by import
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?set in .env.app.staging}
      POSTGRES_USER: ${DATABASE_USER:?set in .env.app.staging}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set in .env.app.staging}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${CACHE_PASSWORD:?set in .env.app.staging}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: always
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?set in .env.app.staging}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data

volumes:
  pg_data:
  redis_data:
  meili_data:
